<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fan Zone Profit Engine</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #131a26;
    --panel-2: #1a2231;
    --border: #233044;
    --text: #e6edf7;
    --muted: #8a99b3;
    --accent: #25e08a;
    --accent-dim: #14a96b;
    --warn: #ffb547;
    --danger: #ff5d6c;
    --primary: #4d8bff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 96px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
  header h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  header .tag { color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 12px; align-items: center; background: var(--panel);
    border: 1px solid var(--border); padding: 16px; border-radius: 12px; margin-bottom: 24px; }
  .controls label { color: var(--muted); font-size: 13px; }
  select, button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 10px 14px; border-radius: 8px; font-size: 14px;
  }
  select { min-width: 220px; }
  button {
    background: var(--primary); border-color: var(--primary); color: white;
    font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .revenue { font-size: 56px; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; line-height: 1; }
  .revenue .sub { display: block; color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 8px; }
  .match-row { display: flex; align-items: center; justify-content: space-between; }
  .match-row .team { font-size: 22px; font-weight: 600; }
  .match-row .vs { color: var(--muted); font-size: 14px; padding: 0 16px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .fans { display: flex; gap: 16px; margin-top: 14px; }
  .fans .chip { background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; flex: 1; }
  .fans .chip .n { color: var(--muted); font-size: 12px; }
  .fans .chip .v { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .fraud { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
    border-radius: 999px; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
  .fraud.low { background: rgba(37, 224, 138, 0.15); color: var(--accent); border: 1px solid var(--accent-dim); }
  .fraud.medium { background: rgba(255, 181, 71, 0.15); color: var(--warn); border: 1px solid var(--warn); }
  .fraud.high { background: rgba(255, 93, 108, 0.18); color: var(--danger); border: 1px solid var(--danger); }
  ul.plan { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  ul.plan li { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; }
  ul.plan li b { color: var(--text); }
  ul.plan li .cat { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-right: 8px; }
  .reasoning { font-size: 15px; line-height: 1.55; color: var(--text); }
  .error { background: rgba(255, 93, 108, 0.12); border: 1px solid var(--danger);
    padding: 14px; border-radius: 10px; color: var(--danger); }
  .placeholder { color: var(--muted); font-size: 14px; padding: 40px; text-align: center; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚽ Fan Zone Profit Engine</h1>
    <span class="tag">World Cup 2026 · Mall Operations Agent</span>
  </header>

  <div class="controls">
    <label for="city">Host City</label>
    <select id="city">
      <option>Dallas</option>
      <option>Los Angeles</option>
      <option>New York</option>
      <option>Miami</option>
      <option>San Francisco</option>
    </select>
    <button id="run">Generate Action Plan</button>
    <span id="status" style="color: var(--muted); font-size: 13px;"></span>
  </div>

  <div id="output">
    <div class="placeholder">Choose a city and click <b>Generate Action Plan</b>.</div>
  </div>
</div>

<script>
const el = (id) => document.getElementById(id);
const fmtMoney = (n) => "$" + Math.round(n).toLocaleString("en-US");
const fmtInt = (n) => Number(n).toLocaleString("en-US");

async function generate() {
  const btn = el("run");
  const city = el("city").value;
  const status = el("status");
  const out = el("output");
  btn.disabled = true;
  status.textContent = "Reasoning…";
  out.innerHTML = '<div class="placeholder">Agent is calling tools and building plan…</div>';
  try {
    const res = await fetch("/agent", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({city})
    });
    const data = await res.json();
    if (!res.ok || data.error) {
      out.innerHTML = `<div class="error">${data.error || "Agent failed."}</div>`;
    } else {
      render(data);
    }
  } catch (e) {
    out.innerHTML = `<div class="error">${e.message}</div>`;
  } finally {
    btn.disabled = false;
    status.textContent = "";
  }
}

function render(d) {
  const m = d.match_summary || {};
  const fw = d.fan_wave || {};
  const rp = d.revenue_projection || {};
  const ap = d.action_plan || {};
  const fraud = (d.fraud_alert || "low").toLowerCase();

  const tenants = (ap.tenant_activations || []).map(t => `
    <li><span class="cat">${t.category}</span><b>${t.name}</b> — ${t.action}</li>`).join("");
  const staffing = (ap.staffing_changes || []).map(s => `
    <li><span class="cat">${s.category}</span>${s.headcount_delta}</li>`).join("");
  const campaigns = (ap.campaigns || []).map(c => `<li>${c}</li>`).join("");

  el("output").innerHTML = `
    <div class="grid">
      <section class="card">
        <h2>Projected Revenue Uplift</h2>
        <div class="revenue">${fmtMoney(rp.amount_usd || 0)}
          <span class="sub">${rp.formula || ""} · capture ${Math.round((rp.capture_rate||0)*100)}%</span>
        </div>
      </section>
      <section class="card">
        <h2>Match</h2>
        <div class="match-row">
          <div class="team">${m.home_team || "?"}</div>
          <div class="vs">vs</div>
          <div class="team">${m.away_team || "?"}</div>
        </div>
        <div class="meta">${m.venue || ""} · ${m.city || ""} · ${m.kickoff_utc || ""}</div>
        <div class="fans">
          <div class="chip"><div class="n">${fw.home?.nationality || "Home"} fans</div>
            <div class="v">${fmtInt(fw.home?.expected_fans || 0)}</div></div>
          <div class="chip"><div class="n">${fw.away?.nationality || "Away"} fans</div>
            <div class="v">${fmtInt(fw.away?.expected_fans || 0)}</div></div>
        </div>
      </section>
      <section class="card">
        <h2>Fraud Alert</h2>
        <span class="fraud ${fraud}">${fraud}</span>
      </section>
      <section class="card">
        <h2>Agent Reasoning</h2>
        <div class="reasoning">${d.reasoning || ""}</div>
      </section>
      <section class="card" style="grid-column: 1 / -1;">
        <h2>Tenant Activations</h2>
        <ul class="plan">${tenants || "<li>No activations.</li>"}</ul>
      </section>
      <section class="card">
        <h2>Staffing Changes</h2>
        <ul class="plan">${staffing || "<li>No changes.</li>"}</ul>
      </section>
      <section class="card">
        <h2>Campaigns</h2>
        <ul class="plan">${campaigns || "<li>No campaigns.</li>"}</ul>
      </section>
    </div>
  `;
}

el("run").addEventListener("click", generate);
</script>
</body>
</html>
